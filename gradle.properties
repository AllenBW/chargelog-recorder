org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
org.gradle.configuration-cache=true
# Task-output cache: a rebuild after `git checkout` or a clean reuses every task whose inputs are
# unchanged instead of recompiling, and CI reuses the previous run's outputs the same way.
org.gradle.caching=true

# :recorder ships RecorderCorpus as a Kotlin test fixture, consumed by :sample (and, upstream, by
# the private app's tests).
android.experimental.enableTestFixturesKotlinSupport=true
