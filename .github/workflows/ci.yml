# Dormant: this workflow is authored for the standalone public repo
# (github.com/AllenBW/chargelog-recorder) and does not run in the private monorepo — it lives
# under recorder/.github/ here (not .github/ at the repo root) precisely so it stays inert until
# recorder/ is mirrored out. Once mirrored, :sample exists, .github/ is at the repo root, and
# every job below becomes live CI on the founding commit. Both jobs are written to be correct on
# day one of that mirror, because the first run is attached to a commit nobody can amend.
name: ci
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Pinned. Unpinned, this resolves to whatever `reuse` is newest on PyPI at run time, and
      # this job's first run is attached to an orphan founding commit that by design can never be
      # amended: a future release that tightens the lint, or moves past REUSE 3.3, would put a
      # permanent red X on it. 6.2.0 is the version the tree is verified against.
      - run: pipx run reuse==6.2.0 lint
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Library unit tests + sample assembly
        run: ./gradlew :recorder:testDebugUnitTest :sample:assembleDebug --no-daemon

  # CONTRIBUTING.md: every commit is signed off (`git commit -s`). One check, asserted over the
  # commits a PR actually adds — there is no second CLA bot to satisfy; the CLA is agreed by
  # opening a code PR and is not machine-enforced. Pull requests only: a push to a branch has no
  # well-defined "commits this change adds".
  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Every commit carries a Signed-off-by trailer
        # SHAs go through the environment rather than being interpolated into the script body,
        # so nothing from the event payload is ever evaluated as shell.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          missing=0
          for sha in $(git rev-list "$BASE_SHA".."$HEAD_SHA"); do
            if ! git show -s --format='%(trailers:key=Signed-off-by,valueonly)' "$sha" \
                 | grep -q '[^[:space:]]'; then
              echo "::error::no Signed-off-by trailer: $sha $(git show -s --format=%s "$sha")"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo
            echo "Sign your commits off: git commit -s"
            echo "To fix commits already pushed: git rebase --signoff \"$BASE_SHA\" && git push --force-with-lease"
            exit 1
          fi
          echo "All commits signed off."
